name: PR

on:
  merge_group:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  Title:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'stord-release-please[bot]' }}

    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}

    timeout-minutes: 10

    steps:
      - name: Check
        uses: stordco/stord-actions/actions-pr-title@d1d613217e6ad945a5a56b255c9523b44f82ccdb # actions-pr-title-v1.1.1
        with:
          regex: '^(feat!|fix!|fix|feat|chore|docs|(fix|feat|chore|docs)\(\w.*\)):\s(\[\w{1,8}-\d{1,8}\]|.*).*'
          hint: |
            Use a conventional commit title, for example:

            chore: a small insignificant change
            fix: [JIRA-1234] fix an existing feature
            feat: [JIRA-1234] a new feature to release
            feat!: a breaking change

            Adding ! (i.e. `feat!:`) represents a breaking change and will result in a SemVer major release.
